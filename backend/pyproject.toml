[project]
name = "pdf-chat-assistant"
version = "1.0.0"
description = "AI Voice & Chat PDF Assistant with RAG and Semantic Cache"
requires-python = ">=3.10"

dependencies = [
    "fastapi[standard]>=0.110.0,<0.140.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-groq>=1.1.0,<2.0.0",
    "langchain-community>=0.4.0,<0.5.0",
    "langchain-core>=1.4.0,<2.0.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "cloudinary>=1.40.0,<2.0.0",
    "valkey>=5.0.0,<7.0.0",
    "fastembed>=0.5.0,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "groq>=0.30.0,<1.0.0",
    "edge-tts>=6.0.0,<8.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = "test_*.py"
asyncio_mode = "auto"
